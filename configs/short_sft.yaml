# Shared high-quality MVP data mix. Profile = short_sft ([FINAL] only).
# Run: python scripts/prepare_data.py --config configs/short_sft.yaml
# Prerequisite: python scripts/build_gold_strategy_set.py
# Disclaimer: research prototype only. Not for clinical use.

name: short_sft
profile: short_sft

data:
  open_vqa:
    mode: huggingface
    hf_sources: [vqa_rad, pathvqa, slake]
    hf_split: train
    hf_limit: 700
  meissa:
    enabled: true
    mode: huggingface
    hf_split: train
    hf_limit: 1500
  uncertainty:
    enabled: true
    blur_radius: 6.0
    crop_fraction: 0.5
    max_bases: 600
    max_image_side: 384
  curriculum:
    weights:
      open_vqa: 0.45
      meissa: 0.30
      uncertainty: 0.25
    val_fraction: 0.1
    seed: 3407
    target_size: 3500
  gold_strategy_set:
    json_path: data/gold_strategy_set.json
    image_dir: data/gold_strategy_set_images
  output_dir: outputs/data/short_sft

model:
  base_model: unsloth/medgemma-1.5-4b-it-unsloth-bnb-4bit
  fallback_base_model: google/medgemma-1.5-4b-it
  max_seq_length: 4096
  load_in_4bit: true

peft:
  finetune_vision_layers: false
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  use_rslora: true
  target_modules: all-linear
  random_state: 3407

train:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  num_train_epochs: 1.5
  max_steps: null
  learning_rate: 0.00015
  optim: adamw_8bit
  weight_decay: 0.01
  lr_scheduler_type: cosine
  seed: 3407
  output_dir: /content/drive/MyDrive/medlook_runs/short_sft
  save_strategy: steps
  save_steps: 100
  save_total_limit: 4
  report_to: none

collator:
  resize: min
  completion_only_loss: true
  train_on_responses_only: true
  instruction_part: "<start_of_turn>user\n"
  response_part: "<start_of_turn>model\n"
