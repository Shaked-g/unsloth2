[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medlook"
version = "0.1.0"
description = "MedLook-4B: calibrated visual-strategy SFT of MedGemma 1.5 4B. Research prototype only, not for clinical use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
  "pillow>=10.0.0",
  "numpy>=1.26.0,<2.2.0",
  "pyyaml>=6.0",
  "datasets>=3.4.1,<4.4.0",
  "imagehash>=4.3.1",
]

[project.optional-dependencies]
train = [
  "unsloth",
  "unsloth_zoo>=2026.6.7",
  "torch>=2.4.0,<2.11.0",
  "torchvision",
  "transformers>=4.51.3,<=5.5.0,!=4.52.0,!=4.52.1,!=4.52.2,!=4.52.3,!=4.53.0,!=4.54.0,!=4.55.0,!=4.55.1,!=4.57.0,!=4.57.4,!=4.57.5,!=5.0.0,!=5.1.0",
  "trl>=0.18.2,<=0.24.0,!=0.19.0",
  "peft>=0.18.0,!=0.11.0",
  "bitsandbytes>=0.45.5,!=0.46.0,!=0.48.0",
  "accelerate>=0.34.1",
  "xformers>=0.0.27.post2",
]
demo = [
  "gradio>=4.44.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["medlook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
